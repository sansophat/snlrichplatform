      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f4ede2"/>
    </radialGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#1e293b" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <ellipse cx="200" cy="340" rx="90" ry="16" fill="#cbd5e1" opacity="0.6"/>
  <g filter="url(#sh)">
    <!-- Bottom book (Navy) -->
    <path d="M 100 280 L 280 280 Q 295 280 295 295 L 295 315 L 100 315 Z" fill="#0a2240"/>
    <rect x="110" y="286" width="180" height="23" fill="#f8fafc"/>
