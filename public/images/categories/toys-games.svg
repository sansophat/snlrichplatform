<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#f6ebd9"/>
    </radialGradient>
    <radialGradient id="body" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e0a96d"/>
      <stop offset="100%" stop-color="#b87c3a"/>
    </radialGradient>
    <radialGradient id="snout" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff0de"/>
      <stop offset="100%" stop-color="#edd2b4"/>
    </radialGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#8a531e" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <ellipse cx="200" cy="350" rx="90" ry="18" fill="#d8be9f" opacity="0.6"/>
  <g filter="url(#sh)">
    <!-- Ears -->
    <circle cx="130" cy="140" r="34" fill="url(#body)"/>
    <circle cx="130" cy="140" r="18" fill="#edd2b4"/>
    <circle cx="270" cy="140" r="34" fill="url(#body)"/>
    <circle cx="270" cy="140" r="18" fill="#edd2b4"/>
    <!-- Body -->
    <ellipse cx="200" cy="275" rx="68" ry="72" fill="url(#body)"/>
    <ellipse cx="200" cy="285" rx="42" ry="48" fill="#edd2b4"/>
    <!-- Arms -->
    <ellipse cx="120" cy="260" rx="22" ry="38" fill="url(#body)" transform="rotate(25 120 260)"/>
    <ellipse cx="280" cy="260" rx="22" ry="38" fill="url(#body)" transform="rotate(-25 280 260)"/>
    <!-- Feet -->
    <ellipse cx="145" cy="335" rx="28" ry="20" fill="url(#body)"/>
    <ellipse cx="145" cy="335" rx="16" ry="12" fill="#edd2b4"/>
    <ellipse cx="255" cy="335" rx="28" ry="20" fill="url(#body)"/>
    <ellipse cx="255" cy="335" rx="16" ry="12" fill="#edd2b4"/>
    <!-- Head -->
    <circle cx="200" cy="180" r="62" fill="url(#body)"/>
    <!-- Snout -->
    <ellipse cx="200" cy="198" rx="28" ry="20" fill="url(#snout)"/>
    <!-- Nose -->
    <ellipse cx="200" cy="190" rx="9" ry="7" fill="#2d1c0c"/>
    <path d="M 200 197 L 200 205 M 193 203 Q 200 209 207 203" stroke="#2d1c0c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="174" cy="172" r="6" fill="#1b120c"/>
    <circle cx="172" cy="170" r="2" fill="#ffffff"/>
    <circle cx="226" cy="172" r="6" fill="#1b120c"/>
    <circle cx="224" cy="170" r="2" fill="#ffffff"/>
  </g>
</svg>
